name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Smoke-test every CLI entrypoint --help
        run: |
          set -e
          agenticqa --help
          agenticqa --version
          agenticqa-probe-headers --help
          agenticqa-probe-errors --help
          agenticqa-branch-protection --help || true
          agenticqa-secret-age --help || true
          agenticqa-audit-app --help
          agenticqa-audit-history --help
          agenticqa-sre-autofix --help
          agenticqa-sdet-trend --help

      - name: Run pytest
        run: pytest --cov=agenticqa_core --cov-report=term-missing
