name: AgenticQA Full Audit Suite (reusable)

# Reusable workflow: callers invoke this via `uses:` from their own
# repos to get the full AgenticQA codified security audit (zero AI cost):
#   1. CI/CD posture (audit_cicd_security: G1-G14)
#   2. App-security pragma self-tests (guards against silent regressions)
#   3. App-security audit (audit_app_security: A1-A18)
#   4. Git-history exposure audit
#
# How it works:
#   - The runner checks out the CALLER's repo at $GITHUB_WORKSPACE.
#   - This workflow installs agenticqa-core via `pip install` from PyPI/GitHub.
#   - The CLI entrypoints (agenticqa-audit-cicd, etc.) run against the
#     caller's working directory.
#
# Callers should pass `fetch-depth: 0` semantics through by relying on
# the default checkout this workflow does (we override fetch-depth: 0).

on:
  workflow_call:
    inputs:
      severity:
        description: 'Severity threshold (high/medium/low)'
        required: false
        default: 'high'
        type: string
      fail_on_findings:
        description: 'Fail the workflow if findings >= severity threshold exist'
        required: false
        default: 'true'
        type: string
      agenticqa_ref:
        description: 'Git ref of AgenticQA-core to install (branch/tag/SHA)'
        required: false
        default: 'main'
        type: string
      history_allow_commits:
        description: 'Comma-separated commit SHAs to suppress in history-exposure audit (legacy exposures that cannot be rewritten)'
        required: false
        default: ''
        type: string
      run_github_native_gates:
        description: 'Check Dependabot + CodeQL alert counts via GitHub API'
        required: false
        default: 'true'
        type: string

permissions:
  contents: read
  security-events: read

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # history_exposure walks the full git log - shallow misses old commits.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.13'

      - name: Install AgenticQA-core from GitHub
        # Install the canonical package - the caller's repo is the
        # working directory and is what gets audited.
        run: |
          python -m pip install --upgrade pip
          pip install "agenticqa-core @ git+https://github.com/the-wolfpack-agency/AgenticQA-core.git@${{ inputs.agenticqa_ref }}"

      - name: CI/CD posture audit
        run: |
          set -e
          agenticqa-audit-cicd --path . --json > cicd-audit.json
          agenticqa-audit-cicd --path . --severity "${{ inputs.severity }}"
          HIGH=$(python3 -c "import json,sys; print(sum(1 for f in json.load(open('cicd-audit.json'))['findings'] if f['severity']=='high'))")
          echo "::notice::cicd_audit_high=$HIGH"
          if [ "${{ inputs.fail_on_findings }}" = "true" ] && [ "$HIGH" -gt "0" ]; then
            echo "::error::CI/CD audit reports $HIGH high-severity findings"
            exit 1
          fi

      - name: App-security pragma self-tests
        # Pragma-suppression behavior is load-bearing - run in-memory
        # self-tests before the real audit so a regressed pragma can't
        # silently mask findings.
        run: agenticqa-test-app-security-pragmas

      - name: App-security audit
        run: |
          set -e
          agenticqa-audit-app --path . --json > app-audit.json
          agenticqa-audit-app --path . --severity "${{ inputs.severity }}"
          HIGH=$(python3 -c "import json,sys; print(sum(1 for f in json.load(open('app-audit.json'))['findings'] if f['severity']=='high'))")
          echo "::notice::app_audit_high=$HIGH"
          if [ "${{ inputs.fail_on_findings }}" = "true" ] && [ "$HIGH" -gt "0" ]; then
            echo "::error::App-security audit reports $HIGH high-severity findings"
            exit 1
          fi

      - name: History-exposure audit
        run: |
          set -e
          ALLOW="${{ inputs.history_allow_commits }}"
          agenticqa-audit-history --path . --allow-commits "$ALLOW" --json > history-audit.json
          agenticqa-audit-history --path . --allow-commits "$ALLOW"
          HIGH=$(python3 -c "import json,sys; print(sum(1 for f in json.load(open('history-audit.json'))['findings'] if f['severity']=='high'))")
          echo "::notice::history_audit_high=$HIGH"
          if [ "${{ inputs.fail_on_findings }}" = "true" ] && [ "$HIGH" -gt "0" ]; then
            echo "::error::History exposes $HIGH sensitive names"
            exit 1
          fi

      - name: GitHub-native security gates (Dependabot + Code Scanning)
        if: inputs.run_github_native_gates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Dependabot alerts require `security-events: read` permission on
          # the workflow. CodeQL alerts use the same scope.
          # NOTE: `gh api` writes its error JSON to stdout *and* exits non-zero
          # on 403. The naive `$(gh api ... || echo "skip")` concatenates the
          # JSON with "skip", which breaks the integer compare below. Capture
          # status separately so the skip path is unambiguous.
          set -e
          if HIGH_CRIT=$(gh api "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
              --jq '[.[] | select(.security_advisory.severity == "high" or .security_advisory.severity == "critical")] | length' 2>/dev/null); then
            :
          else
            HIGH_CRIT="skip"
          fi
          if [ "$HIGH_CRIT" = "skip" ]; then
            echo "::warning::Dependabot API not accessible (token may lack security_events read). Skipping gate."
            exit 0
          fi
          echo "::notice::dependabot_high_or_critical=$HIGH_CRIT"
          if [ "${{ inputs.fail_on_findings }}" = "true" ] && [ "$HIGH_CRIT" -gt "0" ]; then
            echo "::error::$HIGH_CRIT open Dependabot alerts at high/critical severity"
            exit 1
          fi
          if MED=$(gh api "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
              --jq '[.[] | select(.security_advisory.severity == "medium")] | length' 2>/dev/null); then
            :
          else
            MED="skip"
          fi
          if [ "$MED" = "skip" ]; then
            echo "::warning::Dependabot medium-alert query failed — skipping medium gate."
            exit 0
          fi
          echo "::notice::dependabot_medium=$MED"
          MED_CEILING=10
          if [ "${{ inputs.fail_on_findings }}" = "true" ] && [ "$MED" -gt "$MED_CEILING" ]; then
            echo "::error::$MED open Dependabot medium alerts (ceiling=$MED_CEILING)"
            exit 1
          fi

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: agenticqa-audits-${{ github.run_id }}
          path: |
            cicd-audit.json
            app-audit.json
            history-audit.json
          retention-days: 30
